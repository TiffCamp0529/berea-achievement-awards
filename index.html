<title>Student Achievement Awards · Berea College</title>

<style>
:root{
  --blue:#005A8B; --blue-dark:#00466C; --orange:#C75B12; --lightblue:#BFDBEC; --teal:#3095B4; --green:#4f7a00;
  --ink:#1F2A33; --gray:#5B6770; --line:#D8E2EA; --wash:#F2F7FA; --paper:#FFFFFF; --amber:#9a5b00; --amber-bg:#FFF7EC; --red:#b3261e; --red-bg:#fdecea; --green-bg:#eef6e0;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Open Sans",Verdana,sans-serif;font-size:15px;color:var(--ink);background:var(--wash);line-height:1.5}
a{color:var(--blue)}
header.top{background:var(--blue);color:#fff;border-bottom:5px solid var(--orange)}
header.top .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-family:"EB Garamond",Garamond,serif;font-weight:600;font-size:1.7rem;margin:0;line-height:1.1}
header.top .sub{font-size:.85rem;color:var(--lightblue)}
header.top .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem}
.countchip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-weight:600;white-space:nowrap}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:6px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.12)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav.tabs .wrap{max-width:1180px;margin:0 auto;padding:0 10px;display:flex;overflow-x:auto;gap:2px;scrollbar-width:thin}
nav.tabs a{padding:11px 12px;text-decoration:none;color:var(--gray);font-weight:600;font-size:.88rem;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--blue);border-bottom-color:var(--orange)}
nav.tabs a:hover{color:var(--blue)}
.statusbar{max-width:1180px;margin:0 auto;padding:6px 16px;font-size:.8rem;color:var(--gray);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.statusbar .st{font-weight:600;color:var(--green)}
.statusbar .st.warn{color:var(--amber)}
.statusbar .st.err{color:var(--red)}
.banner{max-width:1180px;margin:10px auto 0;padding:10px 14px;border-radius:8px;background:var(--amber-bg);border:1px solid #f0d3a8;color:#5d3b00;font-size:.88rem}
main{max-width:1180px;margin:0 auto;padding:14px 16px 80px}
h2{font-family:"EB Garamond",Garamond,serif;font-weight:600;color:var(--blue);font-size:1.6rem;margin:6px 0 6px}
h3{color:var(--blue);font-size:.95rem;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.muted{color:var(--gray)} .small{font-size:.85rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .v{font-size:1.6rem;font-weight:700;color:var(--blue);line-height:1.1}
.stat .l{font-size:.8rem;color:var(--gray)}
.hero{background:linear-gradient(135deg,#005A8B,#00466C);color:#fff;border-radius:12px;padding:20px 22px;margin-bottom:14px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.hero .big{font-family:"EB Garamond",serif;font-size:3rem;line-height:1;font-weight:600}
.hero .lbl{color:var(--lightblue);font-size:.9rem}
.hero textarea,.hero input{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],input[type=url],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:.92rem;color:var(--ink);background:#fff}
textarea{resize:vertical;min-height:38px;overflow:hidden}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,90,139,.15)}
.bare{border-color:transparent !important;background:transparent !important;padding-left:4px}
.bare:hover{border-color:var(--line) !important}
.bare:focus{border-color:var(--blue) !important;background:#fff !important}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);cursor:pointer;vertical-align:middle}
button{font:inherit;cursor:pointer}
.btn{border:none;border-radius:7px;padding:7px 14px;font-weight:700;font-size:.88rem;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-dark)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--blue)}
.btn.ghost:hover{border-color:var(--blue)}
.btn.orange{background:var(--orange)}
.btn.danger{background:#fff;border:1.5px solid #e6b8b4;color:var(--red)}
.btn.sm{padding:4px 10px;font-size:.8rem;font-weight:600}
.x{background:none;border:none;color:#a0aab2;font-size:1rem;padding:2px 6px;border-radius:5px}
.x:hover{color:var(--red);background:var(--red-bg)}
.mv{background:none;border:none;color:#a0aab2;padding:0 4px;font-size:.8rem}
.mv:hover{color:var(--blue)}
.addrow{margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
.tablewrap table.t{min-width:640px}
table.t th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);border-bottom:2px solid var(--line);padding:6px 6px}
table.t td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
table.t tr.done td{background:#f6faef}
table.t tr.past td{opacity:.75}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.74rem;font-weight:700;white-space:nowrap}
.p-green{background:var(--green-bg);color:var(--green)} .p-amber{background:var(--amber-bg);color:var(--amber)} .p-red{background:var(--red-bg);color:var(--red)} .p-blue{background:#e5f0f7;color:var(--blue)} .p-gray{background:#eef1f3;color:var(--gray)}
.warn{color:var(--amber);font-weight:700;font-size:.78rem;white-space:nowrap}
/* meetings */
.partlabel{font-family:"EB Garamond",serif;color:var(--orange);font-size:1.25rem;font-weight:600;margin:22px 0 2px}
.partnote{color:var(--gray);font-size:.88rem;margin:0 0 10px}
.sesscard{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.sesscard:hover{border-color:var(--blue)}
.sesscard.done{border-left-color:var(--green);opacity:.85}
.sesscard.next{border-left-color:var(--orange);box-shadow:0 0 0 2px rgba(199,91,18,.25)}
.sesscard.checkin{border-left-color:var(--teal);border-left-style:dashed}
.sessnum{flex:0 0 38px;height:38px;border-radius:50%;background:var(--wash);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--lightblue)}
.sesscard.done .sessnum{background:var(--green);color:#fff;border-color:var(--green)}
.sesscard h4{margin:0 0 2px;font-size:1rem;color:var(--ink)}
.sesscard .meta{font-size:.84rem;color:var(--gray)}
.sesscard .statuswrap{margin-left:auto;flex:0 0 auto}
.sesscard select{width:auto;font-size:.8rem;padding:3px 6px}
.tip{background:#eef6fb;border-left:4px solid var(--teal);border-radius:6px;padding:10px 14px;font-size:.92rem}
.agrow{display:grid;grid-template-columns:26px 1fr 64px 52px;gap:8px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.agrow .num{font-weight:700;color:var(--orange);padding-top:6px}
.agrow .notes{grid-column:2 / 5}
.agrow .notes textarea{background:#fffdf6;border-style:dashed}
.minbox{display:flex;align-items:center;gap:3px;font-size:.78rem;color:var(--gray)}
.minbox input{padding:5px 4px;text-align:center}
.listrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.widget{margin:12px 0 18px}
.widget > label, .flabel{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
.opt{display:flex;gap:8px;align-items:center;margin:4px 0}
.embed{border:1px dashed var(--lightblue);border-radius:8px;padding:10px;background:#fbfdff}
.sessnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.headgrid{display:grid;grid-template-columns:1fr 170px 1fr 150px;gap:10px;align-items:end}
@media (max-width:760px){ .headgrid{grid-template-columns:1fr 1fr} .agrow{grid-template-columns:22px 1fr 58px 40px} }
/* awards */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{width:auto;min-width:150px}
.awrow{cursor:pointer}
.awrow:hover td{background:#f6fafd}
.awedit td{background:#fbfdff}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:8px 2px}
.formgrid .wide{grid-column:1 / -1}
/* societies */
.soc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.soc.ok{border-left:5px solid var(--green)} .soc.inactive{opacity:.6}
.soc .nm{font-weight:700;font-size:1rem}
.soc .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* gantt */
.gantt{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;overflow-x:auto}
.ginner{min-width:760px;position:relative}
.gmonths{display:flex;margin-left:230px;border-bottom:1px solid var(--line);font-size:.72rem;color:var(--gray);font-weight:700}
.gmonths div{flex:1;padding:2px 4px;border-left:1px solid var(--line)}
.grow{display:flex;align-items:center;height:22px}
.grow .gl{width:230px;flex:0 0 230px;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.grow .gt{position:relative;flex:1;height:100%}
.gbar{position:absolute;top:5px;height:12px;border-radius:4px;min-width:4px}
.gdia{position:absolute;top:4px;width:13px;height:13px;transform:translateX(-6px) rotate(45deg);border-radius:2px}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;margin:8px 0}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c);vertical-align:-1px}
/* auth */
.authwrap{max-width:420px;margin:50px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px}
.authwrap h2{margin-top:0}
.authwrap label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 3px}
.err{color:var(--red);font-size:.85rem;min-height:1.2em;margin-top:6px}
.ok{color:var(--green)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2a33;color:#fff;padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
details.how summary{cursor:pointer;font-weight:700;color:var(--blue)}
.tmpl textarea{font-size:.88rem}
@media print{
  header.top .right, nav.tabs, .statusbar, .banner, .noprint, .x, .mv, .addrow, .btn{display:none !important}
  body{background:#fff} .card{border:none;padding:4px 0}
  input,textarea,select{border:none !important;padding:0 !important;box-shadow:none !important}
  textarea{height:auto !important}
}
</style>

<script>
/* ================================================================
   APP
   ================================================================ */
const LOCAL_KEY = "bereaAwardsSite.v1";
const CLOUD_CONFIGURED = !!(FIREBASE_CONFIG.apiKey && !/^PASTE/i.test(FIREBASE_CONFIG.apiKey));
let CLOUD = false;               // true once Firebase has loaded successfully
let S = null;                    // the whole shared state
let fbDb = null, fbAuth = null, user = null, dbRef = null;
let pendingRender = false;
let ACCESS = {};                 // who has been given access (cloud mode only)
const timers = {};
const UI = { awQ:"", awCat:"", awDept:"", awRecon:"", awOpen:null, tlShowPast:true };

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const richTip = s => esc(s).replace(/&lt;(\/?)strong&gt;/g,"<$1strong>");
const safeUrl = u => /^(https?:\/\/|mailto:|#|[\w\-./]+$)/i.test(u||"") ? u : "#";
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const toDate = iso => iso ? new Date(iso+"T12:00:00") : null;
function fmt(iso, opts){ const d=toDate(iso); if(!d||isNaN(d)) return ""; return d.toLocaleDateString("en-US", opts||{weekday:"short",month:"short",day:"numeric",year:"numeric"}); }
const fmtShort = iso => fmt(iso,{weekday:"short",month:"short",day:"numeric"});
const isWeekend = iso => { const d=toDate(iso); return d && (d.getDay()===0||d.getDay()===6); };
const daysBetween = (a,b) => Math.round((toDate(b)-toDate(a))/86400000);
const sorted = obj => Object.entries(obj||{}).filter(([k,v])=>v&&typeof v==="object").sort((a,b)=>(a[1].order??0)-(b[1].order??0));
const nextOrder = obj => Object.values(obj||{}).reduce((m,v)=>Math.max(m,(v&&v.order)||0),-1)+1;
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }
function status(msg, cls){ const el=document.getElementById("saveStatus"); el.textContent=msg; el.className="st "+(cls||""); }

/* ---------- build starting data ---------- */
function keyed(arr, prefix, map){ const o={}; (arr||[]).forEach((x,i)=>{ o[prefix+String(i+1).padStart(3,"0")] = Object.assign({order:i}, map?map(x,i):x); }); return o; }
function buildWidget(w){
  if(w.type==="prompt") return {type:"prompt", label:w.label, value:w.value||""};
  if(w.type==="picklist") return {type:"picklist", label:w.label, options:keyed(w.options,"o",o=>({text:o.text,on:!!o.on}))};
  if(w.type==="table") return {type:"table", cols:w.cols.slice(), rows:keyed(w.rows,"r",r=>({cells:r.slice(),done:false}))};
  return {type:"embed", what:w.what, label:w.label||""};
}
function buildSession(s){
  return { n:s.n, part:s.part, title:s.title, date:s.date, time:s.time, status:s.status||"Not started", who:s.who, goal:s.goal, tip:s.tip||"", notes:"", isCheckin:false,
    resources:keyed(s.resources,"r"), prep:keyed(s.prep,"p",t=>({text:t})),
    agenda:keyed(s.agenda,"a",a=>({text:a.t,min:a.min,notes:a.notes||""})),
    commitments:keyed(s.commitments,"k",c=>({who:c.who,what:c.what,when:c.when,done:!!c.done})),
    ws:{heading:s.ws.heading, intro:s.ws.intro||"", widgets:keyed(s.ws.widgets,"w",buildWidget)} };
}
function checkinSession(date, focus){
  return { n:null, part:"Check-in", title:"Check-In Meeting", date:date||"", time:"60 minutes", status:"Not started", who:FULL_GROUP,
    goal:"Open items closed out, current needs handled, nothing falls through the cracks between the bigger sessions.", tip:"", notes:"", isCheckin:true,
    resources:{}, prep:keyed(["Everyone: bring anything that's come up since the last meeting."],"p",t=>({text:t})),
    agenda:keyed([{t:"Standing — Review open commitments: what's done, what's slipping.",min:15},{t:"Focus — "+(focus||"Current or urgent needs from any area (fill in)."),min:30},{t:"Close — Commitments read back; confirm the next meeting's date and topic.",min:15}],"a",a=>({text:a.t,min:a.min,notes:""})),
    commitments:keyed([{who:"",what:"",when:"",done:false}],"k"),
    ws:{heading:"Open Items", intro:"Track what's carried over and what's new.", widgets:keyed([{type:"table",cols:["Open item","Owner","Status"],rows:[["","",""],["","",""],["","",""]]},{type:"prompt",label:"New items raised today:",value:""}],"w",buildWidget)} };
}
function buildSeed(){
  const sessions={};
  SEED_SESSIONS.forEach((s,i)=>{ sessions[s.id]=Object.assign(buildSession(s),{order:i}); });
  SEED_CHECKINS.forEach((c,i)=>{ sessions[c.id]=Object.assign(checkinSession(c.date,c.focus),{order:100+i}); });
  const offCycle = n => /christensen|wood achievement/i.test(n);
  return {
    meta:{version:1, seeded:new Date().toISOString()},
    settings:Object.assign({},SEED_SETTINGS),
    sessions,
    timeline:keyed(SEED_TIMELINE,"t",r=>({name:r[0],cat:r[1],start:r[2],end:r[3]||"",owner:r[4],notes:r[5],confirmed:!!r[6]})),
    awards:keyed(SEED_AWARDS,"aw",a=>({name:a.name,cat:a.cat,dept:a.dept,eligible:a.eligible||"",type:a.type||"",desc:a.desc||"",stipulations:a.stipulations||"",
      fund:"Unknown",agreement:"Unknown",awardspring:"Unknown",cycle:offCycle(a.name)?"Off-cycle":(a.cat==="External"?"External":"Main"),owner:"",gap:offCycle(a.name)?"Off-cycle — align with main cycle or document its own":"",offered:true})),
    societies:keyed(SEED_SOCIETIES,"so",r=>({name:r[0],discipline:r[1],purpose:r[2],eligibility:r[3],sponsor:r[4],email:"",timing:r[5],status:"Unconfirmed",ceremony:"TBD",confirmed:false,inProgram2025:!!r[6],notes:""})),
    comms:keyed(SEED_COMMS,"cm",r=>({message:r[0],audience:r[1],date:r[2],whenText:r[3],sender:r[4],notes:r[5],status:"Not started"})),
    templates:keyed(SEED_TEMPLATES,"tp"),
    budget:keyed(SEED_BUDGET,"b",r=>({desc:r[0],cat:r[1],dept:r[2],est:r[3],act:null,status:"Planned",date:"",notes:r[4]})),
    improvements:keyed(SEED_IMPROVEMENTS,"im",r=>({icon:r[0],title:r[1],challenge:r[2],rec:r[3],status:/date chosen/.test(r[3])?"In progress":"Not started",decision:""})),
    people:keyed(SEED_PEOPLE,"pp",r=>({name:r[0],area:r[1],ws:r[2],email:r[3]}))
  };
}

/* ---------- path get / set ---------- */
function getP(path){ return path.split("/").reduce((o,k)=>o==null?undefined:o[k], S); }
function setLocal(path,val){
  const ks=path.split("/"); let o=S;
  for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=="object") o[ks[i]]={}; o=o[ks[i]]; }
  const last=ks[ks.length-1];
  if(val===null||val===undefined){ if(Array.isArray(o)) o[last]=""; else delete o[last]; } else o[last]=val;
}
function whoAmI(){ if(!user) return "this browser"; const p=Object.values(S&&S.people||{}).find(p=>p.email&&p.email.toLowerCase()===(user.email||"").toLowerCase()); return p?p.name:user.email; }
function write(path,val){
  if(!S) return;
  setLocal(path,val);
  const le={by:whoAmI(), at:new Date().toISOString()};
  setLocal("meta/lastEdit",le);
  if(CLOUD && user){
    status("⟳ Saving…");
    Promise.all([fbDb.ref(DB_ROOT+"/"+path).set(val===undefined?null:val), fbDb.ref(DB_ROOT+"/meta/lastEdit").set(le)])
      .then(()=>status("☁️ Saved to the shared database"))
      .catch(e=>{ status("⚠ Save failed: "+e.message,"err"); });
  } else {
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); status("💾 Saved in this browser only","warn"); }
    catch(e){ status("⚠ This browser won't save — download a backup before closing","err"); }
  }
  showLastEdit();
}
function showLastEdit(){
  const el=document.getElementById("lastEdit"); const le=S&&S.meta&&S.meta.lastEdit;
  el.textContent = le ? "Last change: "+le.by+" · "+new Date(le.at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
}

/* ---------- field builders (every editable field carries its database path) ---------- */
function inp(p,v,o={}){ return `<input type="${o.type||"text"}" class="${o.cls||""}" data-p="${p}" ${o.num?'data-num="1"':""} value="${esc(v)}" placeholder="${esc(o.ph||"")}" ${o.style?`style="${o.style}"`:""} aria-label="${esc(o.aria||o.ph||"")}">`; }
function ta(p,v,o={}){ return `<textarea class="${o.cls||""}" data-p="${p}" rows="${o.rows||1}" placeholder="${esc(o.ph||"")}" aria-label="${esc(o.aria||o.ph||"")}">${esc(v)}</textarea>`; }
function sel(p,v,opts,o={}){ return `<select data-p="${p}" class="${o.cls||""}" aria-label="${esc(o.aria||"")}">${opts.map(x=>{const val=Array.isArray(x)?x[0]:x, lab=Array.isArray(x)?x[1]:x; return `<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(lab)}</option>`;}).join("")}</select>`; }
function chk(p,v,aria){ return `<input type="checkbox" data-p="${p}" ${v?"checked":""} aria-label="${esc(aria||"done")}">`; }
function delBtn(p,label){ return `<button class="x noprint" data-act="del" data-p="${p}" data-label="${esc(label||"this item")}" title="Remove">✕</button>`; }
function addBtn(p,tpl,label,extra){ return `<button class="btn ghost sm addrow noprint" data-act="add" data-p="${p}" data-tpl="${tpl}" ${extra||""}>＋ ${esc(label)}</button>`; }
function mvBtns(p){ return `<button class="mv noprint" data-act="move" data-p="${p}" data-dir="-1" title="Move up">▲</button><button class="mv noprint" data-act="move" data-p="${p}" data-dir="1" title="Move down">▼</button>`; }
const TEMPLATES = {
  agenda:()=>({text:"",min:5,notes:""}), prep:()=>({text:""}), commit:()=>({who:"",what:"",when:"",done:false}), res:()=>({label:"",url:""}),
  option:()=>({text:"",on:false}),
  timeline:()=>({name:"New milestone",cat:"prep",start:todayISO(),end:"",owner:"",notes:"",confirmed:false}),
  award:()=>({name:"New award",cat:"Academic Excellence",dept:"Academic Affairs",eligible:"",type:"Award",desc:"",stipulations:"",fund:"Unknown",agreement:"Unknown",awardspring:"Unknown",cycle:"Main",owner:"",gap:"",offered:true}),
  society:()=>({name:"New society",discipline:"",purpose:"",eligibility:"",sponsor:"",email:"",timing:"",status:"Unconfirmed",ceremony:"TBD",confirmed:false,notes:""}),
  comm:()=>({message:"New message",audience:"",date:todayISO(),whenText:"",sender:"",notes:"",status:"Not started"}),
  template:()=>({title:"New template",when:"",owners:"",body:""}),
  budget:()=>({desc:"New expense",cat:"Other",dept:"Academic Affairs",est:null,act:null,status:"Planned",date:"",notes:""}),
  improvement:()=>({icon:"💡",title:"New improvement",challenge:"",rec:"",status:"Not started",decision:""}),
  person:()=>({name:"",area:"",ws:"",email:""})
};

/* ---------- events ---------- */
function commitEl(el){
  const p=el.dataset.p; clearTimeout(timers[p]); delete timers[p];
  let v=el.value; if(el.dataset.num) v = v===""?null:Number(v);
  if(getP(p)===v) return;
  write(p,v);
}
function isTyping(){ const a=document.activeElement; return !!(a && a.dataset && a.dataset.p && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type!=="checkbox"); }
function autosize(el){ if(el.tagName==="TEXTAREA"){ el.style.height="auto"; el.style.height=(el.scrollHeight+3)+"px"; } }
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset||!el.dataset.p||el.type==="checkbox"||el.tagName==="SELECT"||el.type==="date") return;
  autosize(el); clearTimeout(timers[el.dataset.p]); timers[el.dataset.p]=setTimeout(()=>commitEl(el),600);
});
document.addEventListener("change",e=>{
  const el=e.target; if(!el.dataset||!el.dataset.p) return;
  if(el.type==="checkbox"){ write(el.dataset.p, el.checked); render(); }
  else if(el.tagName==="SELECT"||el.type==="date"){ commitEl(el); render(); }
  else commitEl(el);
});
document.addEventListener("focusout",e=>{
  const el=e.target; if(el.dataset&&el.dataset.p&&timers[el.dataset.p]!==undefined) commitEl(el);
  if(pendingRender) setTimeout(()=>{ if(!isTyping()&&pendingRender){ render(); } },30);
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, p=b.dataset.p;
  if(act==="add"){
    const parent=getP(p)||{}; const id=newId(b.dataset.tpl.slice(0,2));
    let obj = b.dataset.tpl==="row" ? {cells:Array(Number(b.dataset.ncols)).fill(""),done:false} : TEMPLATES[b.dataset.tpl]();
    obj.order=nextOrder(parent);
    write(p+"/"+id,obj);
    if(b.dataset.tpl==="award"){ UI.awOpen=id; UI.awQ=""; UI.awCat=""; UI.awDept=""; UI.awRecon=""; }
    render();
    const fresh=document.querySelector(`[data-p^="${p}/${id}/"]`); if(fresh&&fresh.focus){ fresh.focus(); if(fresh.select) fresh.select(); }
  } else if(act==="del"){
    if(confirm("Remove "+b.dataset.label+"? This can't be undone.")){
      const pr=getP(p); if(/^people\/[^/]+$/.test(p) && pr && pr.uid && CLOUD && user) fbDb.ref("awardsAccess/"+pr.uid).remove();
      write(p,null); render(); }
  } else if(act==="move"){
    const parts=p.split("/"), id=parts.pop(), parentPath=parts.join("/");
    const list=sorted(getP(parentPath)); const i=list.findIndex(([k])=>k===id); const j=i+Number(b.dataset.dir);
    if(j<0||j>=list.length) return;
    list.forEach(([k],idx)=>{ const want = idx===i?j:(idx===j?i:idx); if((list[idx][1].order)!==want) write(parentPath+"/"+k+"/order",want); });
    render();
  } else if(act==="toggleAward"){ UI.awOpen = UI.awOpen===b.dataset.id?null:b.dataset.id; render(); }
});
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });

/* ---------- routing & render ---------- */
const TABS=[["home","🏠 Home"],["meetings","📘 Meetings"],["timeline","📅 Timeline"],["awards","🏆 Awards"],["societies","🏛️ Honor Societies"],["comms","📧 Communications"],["budget","💰 Budget"],["improvements","💡 Improvements"],["team","👥 Team"],["help","❓ Help"]];
function route(){ const h=(location.hash||"#home").slice(1); const [t,id]=h.split("/"); return {tab:t||"home", id}; }
function render(){
  pendingRender=false;
  if(!S){ return; }
  if(isTyping()){ pendingRender=true; return; }
  const r=route(); const y=window.scrollY;
  document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>`<a href="#${k}" class="${(r.tab===k||(r.tab==="m"&&k==="meetings"))?"on":""}">${l}</a>`).join("");
  const days=daysBetween(todayISO(), (S.settings&&S.settings.ceremonyDate)||CEREMONY_DATE);
  document.getElementById("countchip").textContent = days>0 ? `🎓 ${days} days to the ceremony` : (days===0?"🎓 Ceremony day!":"🎓 Ceremony complete");
  const views={home:vHome,meetings:vMeetings,m:vMeeting,timeline:vTimeline,awards:vAwards,societies:vSocieties,comms:vComms,budget:vBudget,improvements:vImprovements,team:vTeam,help:vHelp};
  document.getElementById("main").innerHTML = (views[r.tab]||vHome)(r.id);
  document.querySelectorAll("#main textarea").forEach(autosize);
  showLastEdit();
  window.scrollTo(0,y);
}

/* ---------- shared pieces ---------- */
function sessionsByDate(){ return sorted(S.sessions).sort((a,b)=>(a[1].date||"9999").localeCompare(b[1].date||"9999")); }
function nextMeeting(){ const t=todayISO(); return sessionsByDate().find(([k,s])=>(s.date||"")>=t && s.status!=="Done"); }
function statusPill(s){ const m={"Done":"p-green","Scheduled":"p-blue","Not started":"p-gray","In progress":"p-amber","Sent":"p-green","Ready":"p-blue","Drafting":"p-amber","Paid":"p-green","Committed":"p-amber","Planned":"p-gray"}; return `<span class="pill ${m[s]||"p-gray"}">${esc(s)}</span>`; }
function openCommitments(){
  const out=[]; sessionsByDate().forEach(([sid,s])=>sorted(s.commitments).forEach(([k,c])=>{ if((c.what||"").trim() && !c.done) out.push({sid,s,k,c}); })); return out;
}

/* ---------- HOME ---------- */
function vHome(){
  const st=S.settings||{}; const nm=nextMeeting(); const t=todayISO();
  const days=daysBetween(t, st.ceremonyDate||CEREMONY_DATE);
  const soon=sorted(S.timeline).map(([k,x])=>({k,...x})).filter(x=>{ const end=x.end||x.start; return end>=t && x.start<=addDays(t,45); }).sort((a,b)=>a.start.localeCompare(b.start));
  const oc=openCommitments();
  const sess=Object.values(S.sessions||{}).filter(s=>!s.isCheckin);
  const tl=Object.values(S.timeline||{}); const socs=Object.values(S.societies||{}).filter(s=>s.status!=="Inactive"); const aws=Object.values(S.awards||{}).filter(a=>a.offered!==false);
  return `
  <div class="hero">
    <div><div class="big">${Math.max(days,0)}</div><div class="lbl">days until the ceremony</div></div>
    <div style="flex:1;min-width:260px">
      <div class="lbl">Recognition Ceremony &amp; Reception</div>
      ${inp("settings/ceremonyText",st.ceremonyText,{cls:"bare",style:"color:#fff;font-weight:700;font-size:1.05rem",aria:"Ceremony details"})}
      <div class="lbl" style="margin-top:8px">Our goal this year</div>
      ${ta("settings/goal",st.goal,{cls:"bare",aria:"Goal statement"})}
    </div>
  </div>
  <div class="grid g2">
    <div class="card">
      <h3 style="margin-top:0">Next meeting</h3>
      ${nm?`<div style="font-size:1.1rem;font-weight:700">${esc(nm[1].isCheckin?"Check-In Meeting":"Session "+nm[1].n+" · "+nm[1].title)}</div>
        <div class="muted">🗓 ${fmt(nm[1].date)}${nm[1].date===t?" · <strong style='color:var(--orange)'>TODAY</strong>":""} · ${esc(nm[1].time)}</div>
        <p style="margin:8px 0">🎯 ${esc(nm[1].goal)}</p>
        <a class="btn" href="#m/${nm[0]}" style="text-decoration:none;display:inline-block">Open agenda →</a>`:`<p class="muted">No upcoming meetings scheduled.</p>`}
    </div>

function widget(p,w){

    </tbody></table>${addBtn(p+"/rows","row","Add row",`data-ncols="${cols.length}"`)}</div>`; }
  if(w.type==="embed"){
    const map={timeline:["timeline",()=>timelineTable(false)],comms:["comms",()=>commsTable()],societies:["societies",()=>societiesTable()],awardGaps:["awards",()=>awardGapsTable()]};

  }
  return "";

function copyForTeams(id){
  const s=S.sessions[id]; const L=[];
  L.push((s.isCheckin?"Check-In Meeting":"Session "+s.n+" · "+s.title)+" — "+fmt(s.date));
  L.push("Goal: "+s.goal); L.push("Attendees: "+s.who); L.push("");
  L.push("AGENDA & NOTES"); sorted(s.agenda).forEach(([k,a],i)=>{ L.push(`${i+1}. ${a.text} (${a.min||0} min)`); if(a.notes) L.push("   → "+a.notes); });
  const ws=sorted(s.ws&&s.ws.widgets); if(ws.length){ L.push(""); L.push((s.ws.heading||"WORKSHEET").toUpperCase());
    ws.forEach(([k,w])=>{ if(w.type==="prompt"&&w.value) L.push("• "+w.label+" "+w.value);
      if(w.type==="picklist") { L.push("• "+w.label); sorted(w.options).filter(([k,o])=>o.on).forEach(([k,o])=>L.push("   ✓ "+o.text)); }
      if(w.type==="table") sorted(w.rows).forEach(([k,r])=>{ const c=(w.cols||[]).map((_,i)=>(r.cells||[])[i]).filter(Boolean); if(c.length) L.push("   "+(r.done?"☑ ":"☐ ")+c.join(" | ")); }); }); }
  if(s.notes){ L.push(""); L.push("DECISIONS & NOTES"); L.push(s.notes); }
  const cm=sorted(s.commitments).filter(([k,c])=>c.what); if(cm.length){ L.push(""); L.push("COMMITMENTS (who / what / by when)"); cm.forEach(([k,c])=>L.push(`${c.done?"☑":"☐"} ${c.who} — ${c.what} — ${c.when}`)); }
  const txt=L.join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copied — paste it into the Teams channel")).catch(()=>{ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand("copy");toast("Copied — paste it into Teams");}catch(e){alert(txt);} t.remove(); });
}

function vTimeline(){

function setAccess(k,uid){
  uid=(uid||"").trim(); const p=S.people[k]||{}; const old=p.uid||"";

    if(uid) fbDb.ref("awardsAccess/"+uid).set(p.name||p.email||true).catch(e=>alert("Couldn't grant access: "+e.message));
  }
  write("people/"+k+"/uid", uid||null); render();
}

function exportBackup(){
  if(!S) return; const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="awards-site-backup-"+todayISO()+".json"; document.body.appendChild(a); a.click(); a.remove();
}
function replaceAll(obj){
  S=obj;
  if(CLOUD&&user){ status("⟳ Saving…"); fbDb.ref(DB_ROOT).set(obj).then(()=>{status("☁️ Saved to the shared database");}).catch(e=>status("⚠ "+e.message,"err")); }
  else { try{localStorage.setItem(LOCAL_KEY,JSON.stringify(S)); status("💾 Saved in this browser only","warn");}catch(e){} }
  render();
}
function importBackup(input){
  const f=input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.sessions||!o.timeline) throw new Error("This doesn't look like a backup from this site.");
      if(confirm("Replace ALL current data"+(CLOUD?" in the shared database":"")+" with this backup?")) { replaceAll(o); toast("Backup loaded"); } }
    catch(e){ alert("Couldn't load that file: "+e.message); } input.value=""; };
  r.readAsText(f);
}
function resetAll(){ if(confirm("Replace everything with the starting data? Download a backup first if you might want today's version.") && confirm("Are you sure? This affects everyone.")) replaceAll(buildSeed()); }

/* ---------- start up ---------- */
function startLocal(reason){
  CLOUD=false;
  try{ const raw=localStorage.getItem(LOCAL_KEY); if(raw){ const o=JSON.parse(raw); if(o&&o.sessions) S=o; } }catch(e){}
  if(!S) S=buildSeed();
  document.getElementById("banner").innerHTML=`<div class="banner">👀 <strong>Preview mode</strong> — ${esc(reason)} Changes are saved only in this browser. Use <strong>💾 Backup</strong> to keep a copy; you can import it into the shared site later.</div>`;
  status("💾 Saved in this browser only","warn");
  render();
}
function startCloud(){
  try{ firebase.initializeApp(FIREBASE_CONFIG); fbDb=firebase.database(); fbAuth=firebase.auth(); CLOUD=true; }
  catch(e){ startLocal("Couldn't connect to Firebase ("+e.message+")."); return; }
  status("Connecting…");
  fbAuth.onAuthStateChanged(u=>{
    user=u;
    if(dbRef){ dbRef.off(); dbRef=null; fbDb.ref("awardsAccess").off(); }
    if(!u){ S=null; vLogin(); return; }
    document.getElementById("userbox").innerHTML=`<span>${esc(u.email)}</span> <button class="hbtn" onclick="if(confirm('Sign out?'))fbAuth.signOut()">Sign out</button>`;
    dbRef=fbDb.ref(DB_ROOT);
    dbRef.on("value",snap=>{
      const v=snap.val();
      if(!v){ S=null; vEmptyDb(); return; }
      S=v; status("☁️ Connected to the shared database");
      render();
    },err=>{ status("⚠ No access","err"); document.getElementById("main").innerHTML=`<div class="authwrap"><h2>You're signed in, but don't have access yet</h2>
      <p>Your login works, but the site owner hasn't added you to the team yet. Send them this Login ID:</p>
      <p><code style="font-size:1rem;background:var(--wash);padding:4px 8px;border-radius:6px;user-select:all">${esc(u.uid)}</code></p>
      <p class="small muted">Site owner: if this is <em>your</em> login, check that this exact ID is in the database rules (setup guide, Step 6). Details: ${esc(err.message)}</p></div>`; });
    fbDb.ref("awardsAccess").on("value",snap=>{ ACCESS=snap.val()||{}; if(route().tab==="team") render(); },()=>{});
  });
}
if(CLOUD_CONFIGURED){
